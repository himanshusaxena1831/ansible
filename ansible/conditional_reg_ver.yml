--- 
- name: you want to execute or skip a task based on the outcome of an earlier task
  hosts: all
  tasks: 
    - name: create a file named httpd.conf
      ansible.builtin.shell: touch /home/ansible/httpd.conf ; echo "hello world" >> /home/ansible/httpd.conf
      register: file_exists
      ignore_errors: true
 
    - name: copy file for the application 
      ansible.builtin.copy:
        src: /home/ansible/httpd.conf
        dest: /tmp/httpd.conf
        remote_src: true
      when: file_exists is succeeded

